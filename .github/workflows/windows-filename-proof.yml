name: Windows filename proof
on:
  push:
    paths:
      - '.github/workflows/windows-filename-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Restore exact synthetic fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $proofRoot = Join-Path $env:RUNNER_TEMP 'filenameguard-proof'
          [void][IO.Directory]::CreateDirectory((Join-Path $proofRoot 'fixtures'))
          $payloads = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('')) | ConvertFrom-Json
          foreach ($property in $payloads.PSObject.Properties) {
            $packed = [IO.MemoryStream]::new([Convert]::FromBase64String($property.Value.gzipBase64))
            $gzip = [IO.Compression.GZipStream]::new($packed, [IO.Compression.CompressionMode]::Decompress)
            $path = Join-Path (Join-Path $proofRoot 'fixtures') $property.Name
            $output = [IO.File]::Create($path)
            try { $gzip.CopyTo($output) } finally { $output.Dispose(); $gzip.Dispose(); $packed.Dispose() }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $property.Value.sha256) { throw 'Fixture hash mismatch' }
          }
          [IO.File]::WriteAllBytes((Join-Path $proofRoot 'verify-windows.ps1'), [Convert]::FromBase64String(''))
          Write-Host 'Original fixture ZIP bytes and manifests verified.'
      - name: Verify filenames and contents on Windows
        shell: powershell
        run: |
          $proofRoot = Join-Path $env:RUNNER_TEMP 'filenameguard-proof'
          & powershell.exe -NoLogo -NoProfile -STA -File (Join-Path $proofRoot 'verify-windows.ps1')
          exit $LASTEXITCODE
      - name: Preserve exact Unicode report in logs
        if: always()
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'filenameguard-proof/windows-report.json'
          if (Test-Path -LiteralPath $report) {
            Write-Host ('FILENAMEGUARD_REPORT_BASE64:' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($report)))
          } else { throw 'Windows report was not created.' }
